name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          persist_github_token: false
      - name: Cache npm downloads (not installed dependencies)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'package-lock.json') }}
      - name: Validate metadata
        run: mise exec -- npm run validate:metadata
      - name: Install locked dependencies
        run: mise exec -- npm ci
      - name: Formatting
        run: mise exec -- npm run format:check
      - name: Typecheck
        run: mise exec -- npm run typecheck
      - name: Full unit suite
        run: mise exec -- npm test
      - name: Tooling regressions
        run: mise exec -- npm run test:tooling
      - name: Build browser-only plugin
        run: mise exec -- npm run build
      - name: Upload the checked plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-plugin
          archive: true
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
