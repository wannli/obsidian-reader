name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          persist_github_token: false

      - name: Build and verify
        run: |
          mise exec -- npm ci
          mise exec -- npm run format:check
          mise exec -- npm run validate:metadata
          mise exec -- npm run typecheck
          mise exec -- npm test
          mise exec -- npm run test:tooling
          mise exec -- npm run build

      - name: Prepare release
        id: release
        uses: googleapis/release-please-action@v5

      - name: Upload and publish Obsidian release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(mise exec -- node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json')).version")
          test "$VERSION" = "$TAG"
          test -s dist/main.js
          test -s dist/manifest.json

          files=(dist/main.js dist/manifest.json)
          if [[ -f dist/styles.css ]]; then
            files+=(dist/styles.css)
          fi

          gh release upload "$TAG" "${files[@]}"
          gh release edit "$TAG" --draft=false
